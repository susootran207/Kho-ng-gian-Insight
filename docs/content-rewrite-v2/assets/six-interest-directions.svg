<svg xmlns="http://www.w3.org/2000/svg" width="320" height="973" viewBox="0 0 320 973" role="img" aria-labelledby="title desc" xml:lang="vi">
<title id="title">Sáu hướng sở thích RIASEC cùng các loại hoạt động để khám phá.</title>
<desc id="desc">Sáu thẻ ghi đầy đủ tên gốc và nghĩa ngắn của RIASEC, không xếp bậc hoặc phân giới. Dải cuối nhắc các hướng có thể cùng có mặt, sở thích chưa là phép đo năng lực hoặc quyết định nghề. Bố cục thẻ không biểu diễn khoảng cách giữa các nhóm trong mô hình lục giác.</desc>
<rect width="320" height="973" fill="#fffdf7"/>
<g font-family="DejaVu Sans, sans-serif" fill="#333e32">
<text x="20" y="36" font-size="22" font-weight="700">Sáu hướng để tìm</text>
<text x="20" y="67" font-size="22" font-weight="700">hiểu</text>
<rect x="16" y="114" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="143" font-size="18" font-weight="700">R · REALISTIC</text>
<text x="32" y="170" font-size="16">Thực hành với vật liệu, đồ vật</text>
<text x="32" y="195" font-size="16">hoặc tự nhiên.</text>
<rect x="16" y="243" width="288" height="84" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="272" font-size="18" font-weight="700">I · INVESTIGATIVE</text>
<text x="32" y="299" font-size="16">Tìm hiểu và khảo sát vấn đề.</text>
<rect x="16" y="347" width="288" height="84" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="376" font-size="18" font-weight="700">A · ARTISTIC</text>
<text x="32" y="403" font-size="16">Sáng tạo và thể hiện ý tưởng.</text>
<rect x="16" y="451" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="480" font-size="18" font-weight="700">S · SOCIAL</text>
<text x="32" y="507" font-size="16">Hỗ trợ hoặc hướng dẫn người</text>
<text x="32" y="532" font-size="16">khác.</text>
<rect x="16" y="580" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="609" font-size="18" font-weight="700">E · ENTERPRISING</text>
<text x="32" y="636" font-size="16">Khởi xướng, tổ chức hoặc</text>
<text x="32" y="661" font-size="16">thuyết phục.</text>
<rect x="16" y="709" width="288" height="109" rx="6" fill="#dce3d2" stroke="#616656"/>
<text x="32" y="738" font-size="18" font-weight="700">C · CONVENTIONAL</text>
<text x="32" y="765" font-size="16">Sắp xếp dữ liệu/công việc theo</text>
<text x="32" y="790" font-size="16">trình tự, quy tắc.</text>
<text x="20" y="848" font-size="16">Có thể quan tâm nhiều hướng. Sở</text>
<text x="20" y="873" font-size="16">thích khác năng lực và một</text>
<text x="20" y="898" font-size="16">nghề duy nhất. Hãy tìm hiểu các</text>
<text x="20" y="923" font-size="16">hoạt động thực trong công việc.</text>
</g>
</svg>
